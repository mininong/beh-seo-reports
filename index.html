<style>
:root{--navy:#0F5A79;--cyan:#22B1C8;--soft:#80CDD7;--ice:#D5ECF4;--orange:#F69535;--char:#414141;--grey:#AFAFAF}
*{box-sizing:border-box}body{margin:0;background:#fff;padding:20px;font-family:'IBM Plex Sans Thai','Noto Sans Thai',Arial,sans-serif;color:var(--char)}
.w{max-width:1200px;margin:0 auto}

.g{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:14px}
.c{border-radius:18px;padding:16px 18px}.n{background:var(--navy);color:#fff}.i{background:var(--ice)}.s{background:var(--soft)}
.k{grid-column:span 3}.h{grid-column:span 4}.w6{grid-column:span 6}.w12{grid-column:span 12}
.cap{font-size:12.5px;font-weight:600}.big{font-size:36px;font-weight:500;color:var(--navy);line-height:1.1;margin:6px 0}
.n .big{color:#fff}.d{font-size:13px;font-weight:600;color:var(--navy)}.m{font-size:12px}
.t{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px}.n .t{color:#fff}

.bar{height:8px;border-radius:4px;background:#fff;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy)}
.note{margin-top:14px;font-size:11.5px;line-height:1.7;border-top:1px solid var(--ice);padding-top:10px}
.tag{display:inline-block;background:var(--orange);color:#fff;border-radius:9px;padding:0 8px;font-size:11px;font-weight:600}
