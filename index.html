<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEH Weekly Website & SEO Dashboard 19–23 Oct 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F5A79;--cyan:#22B1C8;--soft:#80CDD7;--ice:#D5ECF4;--orange:#F69535;--char:#414141;--grey:#AFAFAF}
body{margin:0;background:#fff;padding:24px}
.fpb{font-family:'IBM Plex Sans Thai','Noto Sans Thai',Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--char);width:100%;max-width:1320px;margin:0 auto;--ease:cubic-bezier(.32,.72,0,1);font-variant-numeric:tabular-nums}
.fpb *{box-sizing:border-box}
.fpb .fpb-c{padding:20px 22px 22px;background:#fff}
.fpb .top{display:flex;align-items:center;gap:20px;margin-bottom:18px;flex-wrap:wrap;padding-bottom:16px;border-bottom:3px solid var(--ice)}
.fpb .top img{height:60px;width:auto;display:block}
.fpb .top h1{margin:0;font-size:26px;font-weight:700;color:var(--navy);flex:1;min-width:260px;line-height:1.3}
.fpb .top h1 span{display:block;font-weight:400;color:var(--char);font-size:13px;margin-top:4px}
.fpb .seg{display:flex;padding:3px;gap:2px;border-radius:14px;background:var(--ice)}
.fpb .seg b{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--navy)}
.fpb .seg b.on{background:var(--navy);color:#fff}
.fpb .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.fpb .h1{height:376px}.fpb .h2{height:168px}.fpb .h3{min-height:330px}
.fpb #nw{grid-column:span 8}.fpb #alloc{grid-column:span 4}.fpb .kpi{grid-column:span 3}
.fpb #flow{grid-column:span 5}.fpb #opp{grid-column:span 4}.fpb #next{grid-column:span 3}
@media (max-width:1199px){.fpb #nw{grid-column:span 12}.fpb #alloc{grid-column:span 12}.fpb .kpi{grid-column:span 6}.fpb #flow{grid-column:span 12}.fpb #opp,.fpb #next{grid-column:span 6}}
@media (max-width:767px){body{padding:10px}.fpb .fpb-c{padding:12px 6px}.fpb #nw{height:420px}.fpb #alloc{height:376px}.fpb #opp,.fpb #next{grid-column:span 12}.fpb .grid{gap:12px}.fpb .top h1{font-size:20px}.fpb .top img{height:48px}}
@media (max-width:520px){.fpb .kpi{grid-column:span 12}}
.fpb .card{position:relative;border-radius:24px;overflow:hidden;opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .9s var(--ease)}
.fpb .in .card{opacity:1;transform:none}
.fpb .navy{background:var(--navy);color:#fff;--m:#D5ECF4;--a:#80CDD7}
.fpb .char{background:var(--char);color:#fff;--m:#AFAFAF;--a:#80CDD7}
.fpb .soft{background:var(--soft);color:var(--char);--m:#414141;--a:#0F5A79}
.fpb .ice{background:var(--ice);color:var(--char);--m:#414141;--a:#0F5A79}
.fpb .rim,.fpb .g,.fpb .core{display:none}
.fpb .in-c{position:absolute;inset:0;padding:22px 24px;z-index:2}
.fpb .in-c.st{position:relative;inset:auto}
.fpb .ttl{font-size:17px;font-weight:700;color:inherit}
.fpb .soft .ttl,.fpb .ice .ttl{color:var(--navy)}
.fpb .cap{font-size:12.5px;font-weight:600;color:var(--m)}
.fpb .big{font-size:42px;font-weight:300;line-height:1.05;color:inherit}
.fpb .soft .big,.fpb .ice .big{color:var(--navy);font-weight:500}
.fpb .delta{font-size:13px;font-weight:600;color:var(--a)}
.fpb .muted{font-size:12.5px;color:var(--m);font-weight:400}
.fpb .chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600}
.fpb .char .chip{background:rgba(255,255,255,.16)}
.fpb .legend{display:flex;gap:16px;font-size:12px;font-weight:500;color:#fff}
.fpb .legend span{display:inline-flex;align-items:center;gap:6px}.fpb .legend i{width:8px;height:8px;border-radius:50%}
.fpb .row{display:flex;align-items:center;gap:12px}
.fpb .mono{font-variant-numeric:tabular-nums}
.fpb .dots circle{transition:opacity .26s,transform .26s;transform-box:fill-box;transform-origin:center}
.fpb .tip{position:fixed;z-index:50;pointer-events:none;background:var(--char);color:#fff;border-radius:12px;padding:9px 11px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap;min-width:150px}
.fpb .tip.on{opacity:1}.fpb .tip .t{color:var(--ice);margin-bottom:5px}
.fpb .tip .r{display:flex;justify-content:space-between;gap:14px;line-height:19px}.fpb .tip b{font-weight:600}
.fpb ul{list-style:none;margin:0;padding:0}
.fpb li{display:flex;gap:8px;font-size:13px;line-height:1.55;margin-bottom:9px}
.fpb li em{font-style:normal;color:var(--a);font-weight:700}
.fpb .cta{margin-top:12px;padding:10px 12px;border-left:3px solid var(--soft);background:rgba(255,255,255,.12);border-radius:6px;font-size:12.5px;line-height:1.6}
.fpb .hl{display:flex;gap:10px;font-size:13px;line-height:1.5;padding:9px 0}
.fpb .hl b{color:var(--a);white-space:nowrap}
.fpb footer{margin-top:16px;font-size:11.5px;line-height:1.7;color:var(--char)}
@media (prefers-reduced-motion:reduce){.fpb .card{transition:none}}
</style></head><body>

  for(let c=0;c<cols;c++)for(let r=0;r<7;r++){const ci=document.createElementNS(NS,'circle');ci.setAttribute('cx',c*pitch+pitch/2);ci.setAttribute('cy',r*pitch+pitch/2);ci.setAttribute('r',pitch*.36);ci.setAttribute('fill','#fff');ci.setAttribute('opacity',0);svg.appendChild(ci);cells.push([c,r,ci])}
  const set=t=>{const on=new Set();let x=0;for(const ch of t){const g=F[ch]||F[' '];for(let r=0;r<7;r++)for(let k=0;k<g[0].length;k++)if(g[r][k]==='1')on.add((x+k)*8+r);x+=g[0].length+1}
    const used=Math.max(1,x-1);for(const [c,r,ci] of cells){const v=on.has(c*8+r);ci.setAttribute('opacity',v?1:(c<used?.08:0));ci.style.transform=v?'none':'scale(.55)'}
    svg.setAttribute('width',used*pitch);svg.setAttribute('height',7*pitch);svg.setAttribute('viewBox',`0 0 ${used*pitch} ${7*pitch}`)};
  const t0=performance.now();let last='';(function f(n){const t=reduce?1:Math.min(1,(n-t0)/900),s=fmt(to*ease(t));if(s!==last){set(s);last=s}if(t<1)requestAnimationFrame(f)})(t0)}

  const mk=a=>a.map((v,i)=>[X(i),Y(v)]);const A=mk(D.dT),B=mk(D.dL);
  let s=`<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<path d="${smooth(B)}L${X(4)},${H-bot}L${X(0)},${H-bot}Z" fill="#80CDD7" opacity=".35"/><path d="${smooth(B)}" fill="none" stroke="#80CDD7" stroke-width="2"/>`;
  s+=`<path d="${smooth(A)}L${X(4)},${H-bot}L${X(0)},${H-bot}Z" fill="url(#ga)"/><path d="${smooth(A)}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>`;
  A.forEach(([x,y],i)=>{s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="#fff"/><rect x="${x-26}" y="${y-30}" width="52" height="20" rx="10" fill="#fff"/><text x="${x}" y="${y-16}" text-anchor="middle" font-size="11" font-weight="600" fill="#0F5A79" font-family="IBM Plex Sans Thai">${fmt(D.dT[i])}</text><text x="${x}" y="${H-9}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.75)" font-family="IBM Plex Sans Thai">${days[i]}</text>`});
  s+=`<line class="vl" y1="${top}" y2="${H-bot}" stroke="#fff" stroke-width="1.5" opacity="0"/><rect class="hit" width="${W}" height="${H}" fill="transparent"/>`;svg.innerHTML=s;

  s+=`<text y="-22" text-anchor="middle" font-family="IBM Plex Sans Thai" font-weight="200" font-size="52" fill="#fff" letter-spacing="-2">${Math.round(f3*100)}<tspan font-size="17" dy="-24" fill="${T2}">%</tspan></text><text y="0" text-anchor="middle" font-size="12" fill="${T3}" font-family="IBM Plex Sans Thai">${D.top3} จาก ${fmt(D.nq)} คำค้น</text>`;$('alg').innerHTML=s})();

function drawFlow(){const svg=$('fls'),W=$('flow').clientWidth,H=246,L=48,R=W-30,top=30,bot=30,vals=D.wk.map(x=>x[1]),mx=Math.max(...vals)*1.06,mn=Math.min(...vals)*.85,n=vals.length;
  const X=i=>L+i/(n-1)*(R-L),Y=v=>top+(H-top-bot)*(1-(v-mn)/(mx-mn));svg.setAttribute('width',W);svg.setAttribute('height',H);let s='<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F5A79" stop-opacity=".35"/><stop offset="1" stop-color="#0F5A79" stop-opacity="0"/></linearGradient></defs>';
  [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f,y=Y(v);s+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="rgba(15,90,121,.28)"/><text x="${L-10}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#414141" font-family="IBM Plex Sans Thai">${fmt(v)}</text>`});
  const P=vals.map((v,i)=>[X(i),Y(v)]);s+=`<path d="${smooth(P)}L${X(n-1)},${H-bot}L${X(0)},${H-bot}Z" fill="url(#gf)"/><path d="${smooth(P)}" fill="none" stroke="#0F5A79" stroke-width="2.6" stroke-linecap="round"/>`;
  D.wk.forEach((w,i)=>{if(i%2===0||i===n-1)s+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="10" fill="#414141" font-family="IBM Plex Sans Thai">${w[0]}</text>`});
  const e=P[n-1];s+=`<circle cx="${e[0]}" cy="${e[1]}" r="5" fill="#F69535" stroke="#0F5A79" stroke-width="1.5"/><rect x="${e[0]-60}" y="${e[1]-34}" width="86" height="22" rx="11" fill="#0F5A79"/><text x="${e[0]-17}" y="${e[1]-19}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" font-family="IBM Plex Sans Thai">${fmt(vals[n-1])}/วัน</text>`;
  s+=`<line class="vl" y1="${top}" y2="${H-bot}" stroke="#0F5A79" stroke-opacity=".5" opacity="0"/><rect class="hit" x="${L-10}" width="${R-L+20}" height="${H}" fill="transparent"/>`;svg.innerHTML=s;
